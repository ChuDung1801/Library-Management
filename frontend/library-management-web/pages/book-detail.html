<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scholaris Library — Book Detail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --surface:#f7f9fb;--surface-container-lowest:#ffffff;--surface-container-low:#f2f4f6;
    --surface-container-high:#e6e8ea;--on-surface:#191c1e;--on-surface-variant:#43474e;
    --outline:#74777f;--outline-variant:#c4c6cf;--primary-deep:#002045;--secondary:#2b6cb0;
    --secondary-container:#7db6ff;--error:#ba1a1a;--error-container:#ffdad6;--on-error-container:#93000a;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Manrope', sans-serif;background:var(--surface);color:var(--on-surface);}

  header{background:var(--surface-container-lowest);border-bottom:1px solid var(--outline-variant);padding:16px 48px;display:flex;align-items:center;gap:32px;}
  .brand{font-size:22px;font-weight:700;color:var(--primary-deep);display:flex;align-items:center;gap:8px;white-space:nowrap;text-decoration:none;}
  nav{display:flex;gap:28px;flex:1;}
  nav a{text-decoration:none;color:var(--on-surface-variant);font-weight:600;font-size:15px;}
  .avatar{width:38px;height:38px;border-radius:50%;background:var(--secondary);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;}
  .btn-login{padding:9px 18px;border-radius:9999px;background:var(--primary-deep);color:#fff;text-decoration:none;font-weight:700;font-size:14px;}

  .breadcrumb{padding:18px 48px 0;color:var(--outline);font-size:14px;}
  .breadcrumb a{color:var(--secondary);text-decoration:none;font-weight:600;}
  .breadcrumb .sep{margin:0 8px;}
  .breadcrumb .current{color:var(--on-surface);font-weight:600;}

  .detail-layout{display:flex;gap:40px;padding:24px 48px 48px;max-width:1200px;margin:0 auto;align-items:flex-start;}
  .detail-left{width:300px;flex-shrink:0;}
  .cover-frame{aspect-ratio:3/4;border-radius:1.25rem;overflow:hidden;box-shadow:0 20px 40px -12px rgba(0,0,0,.2);margin-bottom:20px;}
  .cover{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:18px;text-align:center;padding:24px;background:linear-gradient(135deg,var(--primary-deep),var(--secondary));}
  .avail-box{background:var(--surface-container-lowest);border-radius:1rem;padding:18px;border:1px solid var(--outline-variant);}
  .avail-label{font-size:11px;font-weight:700;color:var(--outline);letter-spacing:.05em;margin-bottom:8px;}
  .avail-copies{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;margin-bottom:4px;}
  .dot{width:10px;height:10px;border-radius:50%;}
  .dot.available{background:#16a34a;}
  .dot.borrowed{background:var(--secondary);}
  .dot.unavailable{background:var(--error);}

  .detail-right{flex:1;min-width:0;}
  .book-title-lg{font-size:32px;font-weight:700;color:var(--primary-deep);margin:0 0 6px;}
  .book-author-lg{font-size:18px;color:var(--on-surface-variant);margin:0 0 18px;}
  .meta-row{display:flex;gap:24px;flex-wrap:wrap;font-size:14px;color:var(--on-surface-variant);margin-bottom:20px;}
  .divider{border:none;border-top:1px solid var(--outline-variant);margin:20px 0;}
  .section-title{font-size:18px;color:var(--primary-deep);margin:0 0 10px;}
  .synopsis p{line-height:1.7;color:var(--on-surface-variant);font-size:15px;}
  .info-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:20px 0;}
  .info-card{background:var(--surface-container-lowest);border:1px solid var(--outline-variant);border-radius:0.9rem;padding:14px;}
  .info-label{font-size:11px;font-weight:700;color:var(--outline);letter-spacing:.05em;margin-bottom:6px;}
  .info-value{font-weight:700;font-size:15px;color:var(--on-surface);}
  .code-tag{font-family:monospace;background:var(--secondary-container);color:var(--primary-deep);padding:4px 10px;border-radius:0.5rem;font-size:13px;font-weight:700;}

  .error-banner{background:var(--error-container);color:var(--on-error-container);padding:14px 18px;border-radius:0.9rem;font-weight:600;max-width:600px;margin:24px auto;}

  @media (max-width: 800px){
    .detail-layout{flex-direction:column;padding:20px;}
    .detail-left{width:100%;}
    .info-grid{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>
<body>

<header>
  <a class="brand" href="catalog.html">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M2 5.5C2 5.5 5 4 8.5 4C11 4 12 5.5 12 5.5V19.5C12 19.5 11 18 8.5 18C5 18 2 19.5 2 19.5V5.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M22 5.5C22 5.5 19 4 15.5 4C13 4 12 5.5 12 5.5V19.5C12 19.5 13 18 15.5 18C19 18 22 19.5 22 19.5V5.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
    Scholaris Library
  </a>
  <nav><a href="catalog.html">← Back to Catalog</a></nav>
  <div id="authArea"></div>
</header>

<div class="breadcrumb">
  <a href="catalog.html">Catalog</a>
  <span class="sep">›</span>
  <span id="crumbCategory">—</span>
  <span class="sep">›</span>
  <span class="current" id="crumbTitle">…</span>
</div>

<div id="errorBanner" class="error-banner" style="display:none;"></div>

<div class="detail-layout" id="detailLayout" style="display:none;">
  <div class="detail-left">
    <div class="cover-frame"><div class="cover" id="bookCover">…</div></div>
    <div class="avail-box">
      <div class="avail-label">TÌNH TRẠNG SÁCH</div>
      <div class="avail-copies"><span class="dot" id="statusDot"></span><span id="statusText">—</span></div>
      <div style="color:var(--outline);font-size:13px;margin-top:4px;" id="copiesText"></div>
    </div>

    <button id="requestBorrowBtn" style="display:none;width:100%;margin-top:14px;padding:12px;border-radius:1rem;background:var(--primary-deep);color:#fff;border:none;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;">
      📩 Gửi yêu cầu mượn sách
    </button>
    <div id="requestHint" style="display:none;font-size:12px;color:var(--outline);margin-top:8px;text-align:center;"></div>
  </div>

  <div class="detail-right">
    <h1 class="book-title-lg" id="bookTitle">…</h1>
    <p class="book-author-lg" id="bookAuthor">…</p>

    <div class="meta-row">
      <span>📅 Xuất bản: <b id="metaPublished">—</b></span>
      <span>Mã sách: <span class="code-tag" id="metaCode">—</span></span>
    </div>

    <hr class="divider">

    <h2 class="section-title">Giới thiệu sách</h2>
    <div class="synopsis"><p id="introText">—</p></div>

    <h2 class="section-title">Sơ lược nội dung</h2>
    <div class="synopsis"><p id="summaryText">—</p></div>

    <div class="info-grid">
      <div class="info-card"><div class="info-label">NHÀ XUẤT BẢN</div><div class="info-value" id="infoPublisher">—</div></div>
      <div class="info-card"><div class="info-label">NĂM XUẤT BẢN</div><div class="info-value" id="infoYear">—</div></div>
      <div class="info-card"><div class="info-label">THỂ LOẠI</div><div class="info-value" id="infoCategory">—</div></div>
      <div class="info-card"><div class="info-label">SỐ LƯỢNG</div><div class="info-value" id="infoCopies">—</div></div>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/catalog.js"></script>
<script src="../js/borrow-requests.js"></script>
<script>
  // Xem chi tiết sách KHÔNG bắt buộc đăng nhập (Guest/Member đều xem được - SCRUM-39, 40).
  const user = AuthStorage.getUser();
  const authArea = document.getElementById('authArea');
  if (user) {
    authArea.innerHTML = `<div class="avatar" id="userAvatar" title="Đăng xuất">${user.fullName.charAt(0).toUpperCase()}</div>`;
    document.getElementById('userAvatar').addEventListener('click', () => {
      if (confirm('Đăng xuất khỏi Scholaris Library?')) {
        AuthApi.logout();
        window.location.href = 'catalog.html';
      }
    });
  } else {
    authArea.innerHTML = `<a class="btn-login" href="login.html">Đăng nhập</a>`;
  }

  function statusInfo(status) {
    if (status === 'Available') return { dot: 'available', label: 'Có sẵn - sẵn sàng cho mượn' };
    if (status === 'Borrowed') return { dot: 'borrowed', label: 'Đang được mượn' };
    return { dot: 'unavailable', label: 'Không khả dụng' };
  }

  const params = new URLSearchParams(window.location.search);
  const bookId = params.get('id');
  const errorBanner = document.getElementById('errorBanner');
  const detailLayout = document.getElementById('detailLayout');

  async function loadBook() {
    if (!bookId) {
      errorBanner.textContent = 'Thiếu mã sách trên đường dẫn.';
      errorBanner.style.display = 'block';
      return;
    }

    try {
      const book = await CatalogApi.getBookById(bookId);
      const st = statusInfo(book.status);

      document.getElementById('crumbCategory').textContent = book.categoryName || 'Chưa phân loại';
      document.getElementById('crumbTitle').textContent = book.title;
      document.getElementById('bookTitle').textContent = book.title;
      document.getElementById('bookAuthor').textContent = book.author;
      document.getElementById('metaPublished').textContent = book.publicationYear;
      document.getElementById('metaCode').textContent = book.bookCode;
      document.getElementById('introText').textContent = book.introduction || 'Chưa có mô tả.';
      document.getElementById('summaryText').textContent = book.summary || 'Chưa có sơ lược nội dung.';
      document.getElementById('infoPublisher').textContent = book.publisher;
      document.getElementById('infoYear').textContent = book.publicationYear;
      document.getElementById('infoCategory').textContent = book.categoryName || 'Chưa phân loại';
      document.getElementById('infoCopies').textContent = book.totalCopies;

      document.getElementById('statusDot').className = `dot ${st.dot}`;
      document.getElementById('statusText').textContent = st.label;
      document.getElementById('copiesText').textContent = `${book.totalCopies} bản trong thư viện`;

      const cover = document.getElementById('bookCover');
      cover.textContent = book.title;

      setupRequestButton(book);

      detailLayout.style.display = 'flex';
    } catch (err) {
      errorBanner.textContent = err.message || 'Không tìm thấy sách.';
      errorBanner.style.display = 'block';
    }
  }

  /**
   * Nút "Gửi yêu cầu mượn sách" (SCRUM-49) - chỉ hiện với Member đã đăng nhập,
   * và chỉ khi sách còn khả dụng. Guest thấy nút "Đăng nhập để mượn sách".
   * Admin/Employee không thấy nút này (họ dùng trang Transactions để ghi nhận trực tiếp).
   */
  function setupRequestButton(book) {
    const btn = document.getElementById('requestBorrowBtn');
    const hint = document.getElementById('requestHint');
    const available = book.totalCopies > 0;

    if (!user) {
      btn.style.display = 'block';
      btn.textContent = '🔒 Đăng nhập để mượn sách';
      btn.onclick = () => window.location.href = 'login.html';
      return;
    }

    if (user.role !== 'Member') {
      btn.style.display = 'none';
      return;
    }

    btn.style.display = 'block';
    hint.style.display = 'block';

    if (!available) {
      btn.disabled = true;
      btn.style.opacity = '0.6';
      btn.style.cursor = 'not-allowed';
      btn.textContent = 'Sách hiện không khả dụng';
      hint.textContent = 'Bạn có thể quay lại khi sách được trả về thư viện.';
      return;
    }

    btn.textContent = '📩 Gửi yêu cầu mượn sách';
    hint.textContent = 'Yêu cầu sẽ được quản trị viên xem xét và duyệt.';
    btn.onclick = async () => {
      btn.disabled = true;
      btn.textContent = 'Đang gửi...';
      try {
        await BorrowRequestsApi.create(book.id);
        btn.textContent = '✓ Đã gửi yêu cầu';
        hint.textContent = 'Xem trạng thái yêu cầu tại trang "My Borrows".';
      } catch (err) {
        btn.disabled = false;
        btn.textContent = '📩 Gửi yêu cầu mượn sách';
        hint.textContent = err.message;
        hint.style.color = 'var(--error)';
      }
    };
  }

  loadBook();
</script>
</body>
</html>
