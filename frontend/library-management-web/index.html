<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Scholaris Library</title>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
  // Sprint 1: chỉ có luồng Account Management, nên điều hướng đơn giản
  // dựa trên phiên đăng nhập hiện có. Trang chủ khách (Guest) sẽ hoàn thiện ở Sprint 3.
  const user = AuthStorage.getUser();
  if (!user) {
    window.location.href = 'pages/login.html';
  } else if (user.role === 'Admin' || user.role === 'Employee') {
    window.location.href = 'pages/home.html';
  } else {
    window.location.href = 'pages/catalog.html';
  }
</script>
</head>
<body></body>
</html>
